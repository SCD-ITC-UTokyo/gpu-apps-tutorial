# 東大 Miyabi
description: "東大 Miyabi (PBS Pro、Miyabi-G=GH200/NVHPC 24.5+、Miyabi-C=Intel Xeon)"
scheduler: pbs
modes: [gpu, cpu, uni]
# 実行ホスト判定 (fnmatch パターン)。configure.py が現在の hostname と照合し、
# 別マシンの hostname なのに --machine miyabi 指定された場合はエラー終了する。
host_patterns: ["miyabi*", "m[cg]*"]

cpu:
  default: intel
  compilers:
    intel:
      cc:  { cmd: icx,  flags: [--gcc-toolchain=/opt/rh/gcc-toolset-14/root/usr] }
      cxx: { cmd: icpx, flags: [-std=c++17, --gcc-toolchain=/opt/rh/gcc-toolset-14/root/usr] }
      f90: { cmd: ifx,  flags: [-fpp] }
      openmp_flag: -qopenmp
      common_flags: [-O3, -I.]
      fortran_module_flag: "-module mod"
      fortran_include_flag: "-I mod"
    gcc:
      cc:  { cmd: gcc,      flags: [] }
      cxx: { cmd: g++,      flags: [-std=c++17] }
      f90: { cmd: gfortran, flags: [-cpp, -ffree-line-length-none] }
      openmp_flag: -fopenmp
      common_flags: [-O3, -I.]
      fortran_module_flag: "-Jmod"
      fortran_include_flag: "-Imod"

gpu:
  common_flags: ["-tp=native", "-O3", "-I.", "-Wall", "-Minfo=accel,opt,mp"]
  compiler:
    cc:  { cmd: nvc,       flags: [] }
    cxx: { cmd: nvc++,     flags: [-std=c++17] }
    f90: { cmd: nvfortran, flags: [-cpp] }
  memory_models:
    managed:  "-gpu=mem:managed"
    separate: "-gpu=mem:separate"
    unified:  "-gpu=mem:unified:nomanagedalloc"
  fortran_module_flag: "-module mod"
  fortran_include_flag: "-Imod"

# ジョブスクリプト生成用 (configure.py が run.<machine>.<mode>.sh を生成)
job:
  scheduler: pbs
  submit_cmd: qsub
  # Miyabi の qstat は -u オプションを受け付けない (自分のジョブのみが出る)
  status_cmd: qstat
  default_group: xxx
  # default_group が placeholder のときの課金グループ自動検出パターン (fnmatch)。
  # `id -Gn` の所属グループを上から順に照合し、最初に一致したものを採用する。
  # Miyabi では primary group がユーザ名と同名のユーザ専用グループなので
  # `id -gn` では課金グループ (grXX 等) が取れず、この照合が必要。
  group_patterns: ["g[a-z][0-9]*", "jh[0-9]*"]
  default_walltime: "00:10:00"
  # mode → キュー & スレッド数 (Miyabi-G: GH200, Miyabi-C: Intel SPR)
  # modules は configure.py が自動 module load することはなく、
  # 生成ジョブスクリプトの "環境設定" コメントブロックに推奨例として出力するのみ。
  # 実際の module load はユーザが手動で行う (ビルド env と一致させる責務)。
  per_mode:
    gpu: { queue: debug-g, omp_threads: 72,  modules: ["nvidia/25.9"] }
    uni: { queue: debug-g, omp_threads: 72,  modules: ["nvidia/25.9"] }
    cpu: { queue: debug-c, omp_threads: 112, modules: ["intel"] }
  env:
    - "OMP_PROC_BIND=spread"
    - "OMP_PLACES=threads"

# Kokkos (要記入: 実機の spack install 先パス)
kokkos:
  # 要記入: 実機の Kokkos install 先 (KokkosConfig.cmake を含む prefix)。
  # 未記入なら configure.py が環境変数 Kokkos_ROOT や ~/kokkos/* 等から自動検出し、
  # それも失敗したら --kokkos-root での明示指定を促す。
  # 注意: cxx_standard は Kokkos 本体の要求と揃える必要がある。
  #       Kokkos 4.x = C++17、Kokkos 5.x = C++20 必須 (5.x を使うなら 20 に変更)。
  #       Miyabi (GH200) では 4.7.02 を CUDA(sm_90)+OpenMP backend でビルドして動作確認済み。
  root: /xxx/kokkos/4.7.02/
  cxx_standard: 17
