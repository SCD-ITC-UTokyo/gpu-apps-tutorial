# nbody アプリのメタ情報 (configure.py が参照)
name: nbody
description: 3D direct N-body 重力多体問題 (2nd-order leapfrog 軌道積分)

# バイナリ名: {target}.{mode}.{FP_L}.{FP_M}[.{NTHREADS}]
#   例: nbody.gpu.32.32 (単精度) / nbody.gpu.64.64 (倍精度) / nbody.gpu.32.64 (混合精度)
#       nbody.gpu.32.32.256 (auto.opt/manu.opt で --nthreads 256 を指定した場合)
target: nbody

# ソース: nbody は 1 コンパイル単位 (base/nbody.cpp) で common/util の .hpp を include
# Fortran 版は base/nbody.f90 + common/<X>_mod.f90 (4 module ファイル + main)
sources:
  cpp:
    - base/nbody.cpp
  f90:
    - common/type_mod.f90
    - util/timer_mod.f90
    - common/cfg_mod.f90
    - common/init_mod.f90
    - common/conservatives_mod.f90
    - common/io_mod.f90
    - base/nbody.f90

# include paths (configure.py が CMake/Make の -I に追加)
include_dirs:
  - src
  - src/common
  - src/util

# ヘッダ群 (依存解析用)
headers:
  cpp:
    - common/cfg.hpp
    - common/conservatives.hpp
    - common/init.hpp
    - common/io.hpp
    - common/type.hpp
    - util/macro.hpp
    - util/timer.hpp
    - util/type.hpp

# 外部ライブラリ: 無し。
# 以前は Boost 5 種と HDF5 をリンクしていたが、
#   boost::program_options -> 自作パーサ (common/cfg.hpp)
#   boost::timer           -> std::chrono + getrusage (util/timer.hpp)
#   boost::filesystem      -> POSIX mkdir/stat (common/io.hpp)
#   boost::iterators       -> util::counting_iterator (util/counting_iterator.hpp)
#   HDF5                   -> スナップショット出力ごと廃止 (util/hdf5.hpp も削除)
# に置き換え、diffusion / fem と同じく外部依存ゼロにした。
libs: []

# プリプロセッサ定義 (configure.py が -D で全て付与)
# FP_L/FP_M はユーザ指定 (--fp が両方を上書き、または --fp-low/--fp-mid で個別)
defines_default:
  FP_H: 64                  # 高精度部分は常に FP64 (積分や保存量計算)
  SIMD_BITS: 512            # AVX-512 を仮定
  MEMORY_ALIGNMENT: 64      # 64 byte align
  NDEBUG: ""                # release ビルド
  CALCULATE_POTENTIAL: ""   # ポテンシャル計算を有効化

# 浮動小数精度 (FP_L = 低精度部, FP_M = 標準精度部、両方 default 32 = pure single)
default_fp_low: 32
default_fp_mid: 32
