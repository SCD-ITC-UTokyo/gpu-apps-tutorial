<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>fem benchmark dashboard</title>
<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; }
.container { display: flex; height: 100vh; }
.sidebar {
    width: 460px; min-width: 400px; background: #fff;
    border-right: 2px solid #ddd; overflow-y: auto; padding: 18px;
    font-size: 20px;
}
.sidebar h2 { font-size: 24px; margin-bottom: 15px; color: #333; }
.sidebar h3 { font-size: 20px; margin: 15px 0 9px; color: #444;
              border-bottom: 1px solid #ccc; padding-bottom: 5px; }
.control-group { margin-bottom: 18px; }
.control-group label { font-weight: bold; display: block; margin-bottom: 5px; color: #555; }
.control-group select { width: 100%; padding: 8px; font-size: 20px; }
.filter-group { margin-bottom: 12px; border: 1px solid #eee; border-radius: 4px; padding: 9px; }
.filter-title { font-weight: bold; color: #444; margin-bottom: 6px;
               display: flex; justify-content: space-between; align-items: center; }
.filter-checks { max-height: 195px; overflow-y: auto; padding-left: 6px; }
.filter-checks label { cursor: pointer; white-space: nowrap; font-size: 18px;
                       display: block; padding: 2px 0; }
.filter-checks label.disabled { color: #bbb; cursor: not-allowed; }
.filter-checks label.disabled input { cursor: not-allowed; }
.filter-checks .count { color: #888; font-size: 17px; margin-left: 6px; }
.filter-checks label.disabled .count { color: #ddd; }
.toggle-btn { font-size: 15px; padding: 2px 9px; cursor: pointer;
             background: #eee; border: 1px solid #ccc; border-radius: 3px; }
.main { flex: 1; display: flex; flex-direction: column; }
#chart { flex: 1; }
.info-bar { background: #fff; padding: 12px 24px; border-top: 1px solid #ddd;
           font-size: 18px; color: #666; }
</style>
</head>
<body>
<div class="container">
  <div class="sidebar">
    <h2>fem dashboard</h2>

    <h3>軸設定</h3>
    <div class="control-group">
      <label>グラフ種別</label>
      <select id="chartType" onchange="updateChart()">
        <option value="scatter" selected>散布図 (Scatter)</option>
        <option value="line">折れ線 (Line)</option>
        <option value="bar">棒グラフ (Bar)</option>
        <option value="box">箱ひげ図 (Box)</option>
        <option value="histogram">ヒストグラム (Histogram)</option>
    </select>
    </div>
    <div class="control-group">
      <label>X 軸</label>
      <select id="xAxis" onchange="updateChart()"><option value="fp" >fp</option>
<option value="N" selected>N</option>
<option value="time_sec" >time_sec</option>
<option value="performance_gflops" >performance_gflops</option>
<option value="error" >error</option>
<option value="real_sec" >real_sec</option>
<option value="user_sec" >user_sec</option>
<option value="sys_sec" >sys_sec</option></select>
    </div>
    <div class="control-group">
      <label>Y 軸</label>
      <select id="yAxis" onchange="updateChart()"><option value="fp" >fp</option>
<option value="N" >N</option>
<option value="time_sec" >time_sec</option>
<option value="performance_gflops" selected>performance_gflops</option>
<option value="error" >error</option>
<option value="real_sec" >real_sec</option>
<option value="user_sec" >user_sec</option>
<option value="sys_sec" >sys_sec</option></select>
    </div>
    <div class="control-group">
      <label>色分け</label>
      <select id="colorBy" onchange="updateChart()"><option value="impl" selected>impl</option>
<option value="variant_display" >variant_display</option>
<option value="memory_model" >memory_model</option>
<option value="optimization_type" >optimization_type</option>
<option value="machine" >machine</option>
<option value="mode" >mode</option>
<option value="language" >language</option>
<option value="fp" >fp</option>
<option value="param_display" >param_display</option></select>
    </div>
    <div class="control-group">
      <label>X 軸スケール</label>
      <select id="xScale" onchange="updateChart()">
        <option value="linear">線形 (Linear)</option>
        <option value="log" selected>対数 (Log)</option>
    </select>
    </div>
    <div class="control-group">
      <label>Y 軸スケール</label>
      <select id="yScale" onchange="updateChart()">
        <option value="linear">線形 (Linear)</option>
        <option value="log" selected>対数 (Log)</option>
    </select>
    </div>
    <div class="control-group">
      <label>数値表記</label>
      <select id="numFmt" onchange="updateChart()">
        <option value="power" selected>10^n 上付き (10⁹)</option>
        <option value="E">E表記 (1E+09)</option>
        <option value="e">e表記 (1e+9)</option>
        <option value="SI">SI接頭辞 (1G, 1T)</option>
        <option value="none">そのまま (1000000000)</option>
    </select>
    </div>

    <h3>フィルタ</h3>
    <div class="filter-group"><div class="filter-title">machine <button class="toggle-btn" onclick="toggleAll(this, 'machine')">全解除</button></div><div class="filter-checks"><label data-val="miyabi"><input type="checkbox" class="filter-cb" data-col="machine" value="miyabi" checked> <span class="lbl">miyabi</span><span class="count"></span></label>
<label data-val="wisteria"><input type="checkbox" class="filter-cb" data-col="machine" value="wisteria" checked> <span class="lbl">wisteria</span><span class="count"></span></label></div></div>
<div class="filter-group"><div class="filter-title">mode <button class="toggle-btn" onclick="toggleAll(this, 'mode')">全解除</button></div><div class="filter-checks"><label data-val="cpu"><input type="checkbox" class="filter-cb" data-col="mode" value="cpu" checked> <span class="lbl">cpu</span><span class="count"></span></label>
<label data-val="gpu"><input type="checkbox" class="filter-cb" data-col="mode" value="gpu" checked> <span class="lbl">gpu</span><span class="count"></span></label>
<label data-val="uni"><input type="checkbox" class="filter-cb" data-col="mode" value="uni" checked> <span class="lbl">uni</span><span class="count"></span></label></div></div>
<div class="filter-group"><div class="filter-title">language <button class="toggle-btn" onclick="toggleAll(this, 'language')">全解除</button></div><div class="filter-checks"><label data-val="cpp"><input type="checkbox" class="filter-cb" data-col="language" value="cpp" checked> <span class="lbl">cpp</span><span class="count"></span></label>
<label data-val="f90"><input type="checkbox" class="filter-cb" data-col="language" value="f90" checked> <span class="lbl">f90</span><span class="count"></span></label></div></div>
<div class="filter-group"><div class="filter-title">impl <button class="toggle-btn" onclick="toggleAll(this, 'impl')">全解除</button></div><div class="filter-checks"><label data-val="do-concurrent"><input type="checkbox" class="filter-cb" data-col="impl" value="do-concurrent" checked> <span class="lbl">do-concurrent</span><span class="count"></span></label>
<label data-val="kokkos"><input type="checkbox" class="filter-cb" data-col="impl" value="kokkos" checked> <span class="lbl">kokkos</span><span class="count"></span></label>
<label data-val="openacc"><input type="checkbox" class="filter-cb" data-col="impl" value="openacc" checked> <span class="lbl">openacc</span><span class="count"></span></label>
<label data-val="openmp-cpu"><input type="checkbox" class="filter-cb" data-col="impl" value="openmp-cpu" checked> <span class="lbl">openmp-cpu</span><span class="count"></span></label>
<label data-val="openmp-target"><input type="checkbox" class="filter-cb" data-col="impl" value="openmp-target" checked> <span class="lbl">openmp-target</span><span class="count"></span></label>
<label data-val="stdpar"><input type="checkbox" class="filter-cb" data-col="impl" value="stdpar" checked> <span class="lbl">stdpar</span><span class="count"></span></label></div></div>
<div class="filter-group"><div class="filter-title">variant_display <button class="toggle-btn" onclick="toggleAll(this, 'variant_display')">全解除</button></div><div class="filter-checks"><label data-val="(no variant)"><input type="checkbox" class="filter-cb" data-col="variant_display" value="(no variant)" checked> <span class="lbl">(no variant)</span><span class="count"></span></label>
<label data-val="auto.def"><input type="checkbox" class="filter-cb" data-col="variant_display" value="auto.def" checked> <span class="lbl">auto.def</span><span class="count"></span></label>
<label data-val="auto.opt"><input type="checkbox" class="filter-cb" data-col="variant_display" value="auto.opt" checked> <span class="lbl">auto.opt</span><span class="count"></span></label>
<label data-val="manu.def"><input type="checkbox" class="filter-cb" data-col="variant_display" value="manu.def" checked> <span class="lbl">manu.def</span><span class="count"></span></label>
<label data-val="manu.opt"><input type="checkbox" class="filter-cb" data-col="variant_display" value="manu.opt" checked> <span class="lbl">manu.opt</span><span class="count"></span></label>
<label data-val="mdrange/baseline"><input type="checkbox" class="filter-cb" data-col="variant_display" value="mdrange/baseline" checked> <span class="lbl">mdrange/baseline</span><span class="count"></span></label>
<label data-val="mdrange/cpu-tile-sweep"><input type="checkbox" class="filter-cb" data-col="variant_display" value="mdrange/cpu-tile-sweep" checked> <span class="lbl">mdrange/cpu-tile-sweep</span><span class="count"></span></label>
<label data-val="mdrange/uvm"><input type="checkbox" class="filter-cb" data-col="variant_display" value="mdrange/uvm" checked> <span class="lbl">mdrange/uvm</span><span class="count"></span></label>
<label data-val="mdrange/uvm-tile-sweep"><input type="checkbox" class="filter-cb" data-col="variant_display" value="mdrange/uvm-tile-sweep" checked> <span class="lbl">mdrange/uvm-tile-sweep</span><span class="count"></span></label>
<label data-val="range/baseline"><input type="checkbox" class="filter-cb" data-col="variant_display" value="range/baseline" checked> <span class="lbl">range/baseline</span><span class="count"></span></label>
<label data-val="range/cpu-sweep"><input type="checkbox" class="filter-cb" data-col="variant_display" value="range/cpu-sweep" checked> <span class="lbl">range/cpu-sweep</span><span class="count"></span></label>
<label data-val="range/uvm"><input type="checkbox" class="filter-cb" data-col="variant_display" value="range/uvm" checked> <span class="lbl">range/uvm</span><span class="count"></span></label>
<label data-val="range/uvm-sweep"><input type="checkbox" class="filter-cb" data-col="variant_display" value="range/uvm-sweep" checked> <span class="lbl">range/uvm-sweep</span><span class="count"></span></label>
<label data-val="team/baseline"><input type="checkbox" class="filter-cb" data-col="variant_display" value="team/baseline" checked> <span class="lbl">team/baseline</span><span class="count"></span></label>
<label data-val="team/cpu-chunk-sweep"><input type="checkbox" class="filter-cb" data-col="variant_display" value="team/cpu-chunk-sweep" checked> <span class="lbl">team/cpu-chunk-sweep</span><span class="count"></span></label>
<label data-val="team/uvm"><input type="checkbox" class="filter-cb" data-col="variant_display" value="team/uvm" checked> <span class="lbl">team/uvm</span><span class="count"></span></label>
<label data-val="team/uvm-chunk-sweep"><input type="checkbox" class="filter-cb" data-col="variant_display" value="team/uvm-chunk-sweep" checked> <span class="lbl">team/uvm-chunk-sweep</span><span class="count"></span></label></div></div>
<div class="filter-group"><div class="filter-title">memory_model <button class="toggle-btn" onclick="toggleAll(this, 'memory_model')">全解除</button></div><div class="filter-checks"><label data-val="cpu-only"><input type="checkbox" class="filter-cb" data-col="memory_model" value="cpu-only" checked> <span class="lbl">cpu-only</span><span class="count"></span></label>
<label data-val="kokkos-default"><input type="checkbox" class="filter-cb" data-col="memory_model" value="kokkos-default" checked> <span class="lbl">kokkos-default</span><span class="count"></span></label>
<label data-val="kokkos-uvm"><input type="checkbox" class="filter-cb" data-col="memory_model" value="kokkos-uvm" checked> <span class="lbl">kokkos-uvm</span><span class="count"></span></label>
<label data-val="managed"><input type="checkbox" class="filter-cb" data-col="memory_model" value="managed" checked> <span class="lbl">managed</span><span class="count"></span></label>
<label data-val="separate"><input type="checkbox" class="filter-cb" data-col="memory_model" value="separate" checked> <span class="lbl">separate</span><span class="count"></span></label>
<label data-val="unified"><input type="checkbox" class="filter-cb" data-col="memory_model" value="unified" checked> <span class="lbl">unified</span><span class="count"></span></label></div></div>
<div class="filter-group"><div class="filter-title">param_display <button class="toggle-btn" onclick="toggleAll(this, 'param_display')">全解除</button></div><div class="filter-checks"><label data-val="(baseline)"><input type="checkbox" class="filter-cb" data-col="param_display" value="(baseline)" checked> <span class="lbl">(baseline)</span><span class="count"></span></label>
<label data-val="NTHREADS=128"><input type="checkbox" class="filter-cb" data-col="param_display" value="NTHREADS=128" checked> <span class="lbl">NTHREADS=128</span><span class="count"></span></label>
<label data-val="node=miyabi-c(Intel)"><input type="checkbox" class="filter-cb" data-col="param_display" value="node=miyabi-c(Intel)" checked> <span class="lbl">node=miyabi-c(Intel)</span><span class="count"></span></label>
<label data-val="node=miyabi-g(GH200-CPU,OMP-only)"><input type="checkbox" class="filter-cb" data-col="param_display" value="node=miyabi-g(GH200-CPU,OMP-only)" checked> <span class="lbl">node=miyabi-g(GH200-CPU,OMP-only)</span><span class="count"></span></label>
<label data-val="node=miyabi-g(GH200-GPU)"><input type="checkbox" class="filter-cb" data-col="param_display" value="node=miyabi-g(GH200-GPU)" checked> <span class="lbl">node=miyabi-g(GH200-GPU)</span><span class="count"></span></label>
<label data-val="node=miyabi-g(GH200-GPU),kokkos=4.7.02(sm_90)"><input type="checkbox" class="filter-cb" data-col="param_display" value="node=miyabi-g(GH200-GPU),kokkos=4.7.02(sm_90)" checked> <span class="lbl">node=miyabi-g(GH200-GPU),kokkos=4.7.02(sm_90)</span><span class="count"></span></label></div></div>
<div class="filter-group"><div class="filter-title">fp <button class="toggle-btn" onclick="toggleAll(this, 'fp')">全解除</button></div><div class="filter-checks"><label data-val="32"><input type="checkbox" class="filter-cb" data-col="fp" value="32" checked> <span class="lbl">32</span><span class="count"></span></label>
<label data-val="64"><input type="checkbox" class="filter-cb" data-col="fp" value="64" checked> <span class="lbl">64</span><span class="count"></span></label></div></div>
  </div>
  <div class="main">
    <div id="chart"></div>
    <div class="info-bar" id="infoBar">
      左のドロップダウン / チェックボックスを操作するとグラフが更新されます
    </div>
  </div>
</div>

const PALETTE = ["#636EFA", "#EF553B", "#00CC96", "#AB63FA", "#FFA15A", "#19D3F3", "#FF6692", "#B6E880", "#FF97FF", "#FECB52", "#1F77B4", "#FF7F0E", "#2CA02C", "#D62728", "#9467BD", "#8C564B", "#E377C2", "#7F7F7F", "#BCBD22", "#17BECF"];

/** 全 filter group (col name) を列挙 */
function filterCols() {
    const cols = new Set();
    document.querySelectorAll('.filter-cb').forEach(cb => cols.add(cb.dataset.col));
    return Array.from(cols);
}

/** 指定 col を除いた全フィルタが許す行を返す (連動カウント用) */
function getFilteredExcept(skipCol) {
    const allowed = {};
    document.querySelectorAll('.filter-cb').forEach(cb => {
        if (cb.dataset.col === skipCol) return;
        const col = cb.dataset.col;
        if (!allowed[col]) allowed[col] = new Set();
        if (cb.checked) allowed[col].add(cb.value);
    });
    return DATA.filter(row => {
        for (const col in allowed) {
            const val = row[col];
            let s = (val === null || val === undefined) ? "" : String(val);
            if (s === "nan" || s === "NaN") s = "";
            if (!allowed[col].has(s)) return false;
        }
        return true;
    });
}

/** 全フィルタが許す行を返す (チャート表示用) */
function getFilteredData() {
    const allowed = {};
    document.querySelectorAll('.filter-cb').forEach(cb => {
        const col = cb.dataset.col;
        if (!allowed[col]) allowed[col] = new Set();
        if (cb.checked) allowed[col].add(cb.value);
    });
    return DATA.filter(row => {
        for (const col in allowed) {
            const val = row[col];
            let s = (val === null || val === undefined) ? "" : String(val);
            if (s === "nan" || s === "NaN") s = "";
            if (!allowed[col].has(s)) return false;
        }
        return true;
    });
}

/** 各 filter group のカウントを更新し、0 件のオプションを無効化 */
function updateFilterCounts() {
    filterCols().forEach(col => {
        const matching = getFilteredExcept(col);
        const counts = {};
        matching.forEach(row => {
            const val = row[col];
            let s = (val === null || val === undefined) ? "" : String(val);
            if (s === "nan" || s === "NaN") s = "";
            counts[s] = (counts[s] || 0) + 1;
        });
        document.querySelectorAll(`.filter-cb[data-col="${col}"]`).forEach(cb => {
            const c = counts[cb.value] || 0;
            const label = cb.parentElement;
            const span = label.querySelector('.count');
            if (span) span.textContent = ` (${c})`;
            if (c === 0) {
                cb.disabled = true;
                label.classList.add('disabled');
            } else {
                cb.disabled = false;
                label.classList.remove('disabled');
            }
        });
    });
}

function toggleAll(btn, col) {
    // 無効化されてない (= 該当データあり) cb のみを対象に
    const cbs = Array.from(document.querySelectorAll(`.filter-cb[data-col="${col}"]`))
        .filter(c => !c.disabled);
    const anyChecked = cbs.some(c => c.checked);
    cbs.forEach(c => c.checked = !anyChecked);
    btn.textContent = anyChecked ? "全選択" : "全解除";
    onFilterChange();
}

function onFilterChange() {
    updateFilterCounts();
    updateChart();
}

document.querySelectorAll('.filter-cb').forEach(cb => {
    cb.addEventListener('change', onFilterChange);
});

function fmt(v) {
    if (v === null || v === undefined || v === "") return "—";
    if (typeof v === "number") {
        if (Math.abs(v) < 1e-3 || Math.abs(v) >= 1e6) return v.toExponential(3);
        return Number(v.toPrecision(4));
    }
    return v;
}

function hoverText(r) {
    return `<b>${r['impl']}</b>`
        + (r['variant_display'] && r['variant_display'] !== '(no variant)' ? ` / ${r['variant_display']}` : '')
        + (r['param_display'] && r['param_display'] !== '(baseline)' ? ` [${r['param_display']}]` : '')
        + `<br>machine=${r['machine']}/${r['mode']}  lang=${r['language']}  fp=${r['fp']}<br>`
        + `memory=${r['memory_model']}  opt=${r['optimization_type']}<br>`
        + `N=${r['N']} (NP: 節点数)<br>`
        + `time=${fmt(r['time_sec'])}s  perf=${fmt(r['performance_gflops'])} GFlop/s<br>`
        + `err=${fmt(r['error'])}`;
}

function updateChart() {
    const xCol     = document.getElementById('xAxis').value;
    const yCol     = document.getElementById('yAxis').value;
    const colorBy  = document.getElementById('colorBy').value;
    const chartType= document.getElementById('chartType').value;
    const xScale   = document.getElementById('xScale').value;
    const yScale   = document.getElementById('yScale').value;
    const numFmt   = document.getElementById('numFmt').value;

    const filtered = getFilteredData();
    document.getElementById('infoBar').textContent =
        `表示中: ${filtered.length} / ${DATA.length} 行 | `
        + `X: ${xCol} (${xScale}) | Y: ${yCol} (${yScale}) | 色: ${colorBy}`;

    const groups = {};
    filtered.forEach(row => {
        const key = (row[colorBy] === null || row[colorBy] === undefined || row[colorBy] === "")
            ? "(空)" : String(row[colorBy]);
        if (!groups[key]) groups[key] = [];
        groups[key].push(row);
    });

    const traces = [];
    const groupNames = Object.keys(groups).sort();
    groupNames.forEach((name, i) => {
        const rows = groups[name];
        const color = PALETTE[i % PALETTE.length];
        const hovers = rows.map(hoverText);

        if (chartType === 'scatter') {
            traces.push({
                x: rows.map(r => r[xCol]),
                y: rows.map(r => r[yCol]),
                mode: 'markers',
                marker: { color: color, size: 7, opacity: 0.75 },
                name: name,
                text: hovers,
                hoverinfo: 'text',
            });
        } else if (chartType === 'line') {
            const pairs = rows.map(r => [r[xCol], r[yCol], r]);
            pairs.sort((a, b) => (Number(a[0]) || 0) - (Number(b[0]) || 0));
            traces.push({
                x: pairs.map(p => p[0]),
                y: pairs.map(p => p[1]),
                mode: 'lines+markers',
                marker: { color: color, size: 5 },
                line: { color: color, width: 2 },
                name: name,
                text: pairs.map(p => hoverText(p[2])),
                hoverinfo: 'text',
            });
        } else if (chartType === 'bar') {
            traces.push({
                x: rows.map(r => r[xCol]),
                y: rows.map(r => r[yCol]),
                type: 'bar',
                marker: { color: color, opacity: 0.75 },
                name: name,
                text: hovers,
                hoverinfo: 'text',
            });
        } else if (chartType === 'box') {
            traces.push({
                y: rows.map(r => r[yCol]),
                type: 'box',
                marker: { color: color },
                name: name,
            });
        } else if (chartType === 'histogram') {
            traces.push({
                x: rows.map(r => r[yCol]),
                type: 'histogram',
                marker: { color: color, opacity: 0.65 },
                name: name,
            });
        }
    });

    const layout = {
        title: { text: `${yCol}  vs  ${xCol}`, font: { size: 24 } },
        xaxis: {
            title: { text: xCol, font: { size: 21 } },
            type: (chartType === 'box') ? 'category' : xScale,
            automargin: true,
            exponentformat: numFmt,
            showexponent: 'all',
            tickfont: { size: 17 },
        },
        yaxis: {
            title: { text: yCol, font: { size: 21 } },
            type: (chartType === 'histogram') ? 'linear' : yScale,
            automargin: true,
            exponentformat: numFmt,
            showexponent: 'all',
            tickfont: { size: 17 },
        },
        legend: { orientation: 'v', x: 1.02, y: 1, font: { size: 17 } },
        margin: { l: 100, r: 280, t: 70, b: 80 },
        hovermode: 'closest',
        template: 'plotly_white',
    };

    Plotly.newPlot('chart', traces, layout, {
        responsive: true,
        displayModeBar: true,
        modeBarButtonsToAdd: ['toggleSpikelines'],
    });
}

// 初回ロード時: カウント計算 + チャート描画
updateFilterCounts();
updateChart();
</script>
