# 東大 Wisteria
description: "東大 Wisteria (PJM、Aquarius=A100/NVHPC 24.1、Odyssey=Fujitsu A64FX)"
scheduler: pjm
modes: [gpu, cpu]   # uni 非対応 (NVHPC 24.1 では mem:unified が無い)
# 実行ホスト判定 (fnmatch パターン)
host_patterns: ["wisteria*", "w[oa]*"]

cpu:
  # Odyssey (A64FX = aarch64) 向け。ログインノードは x86_64 なので、
  # そこで使える gcc/gfortran は x86 バイナリを作ってしまい debug-o で実行できない
  # (aarch64 版 gcc は /work/opt/local/aarch64/cores にあるが計算ノード上でしか動かない)。
  # そのため既定は Fujitsu クロスコンパイラ (module load fj) にする。
  #   C/C++   : fccpx / FCCpx
  #   Fortran : frtpx  (fccpx は f90 を持たないため default_f90 で分ける)
  default: fccpx
  default_f90: frtpx
  compilers:
    gcc:
      cc:  { cmd: gcc,      flags: [] }
      cxx: { cmd: g++,      flags: [-std=c++17] }
      f90: { cmd: gfortran, flags: [-cpp, -ffree-line-length-none] }
      openmp_flag: -fopenmp
      common_flags: [-O3, -I.]
      fortran_module_flag: "-Jmod"
      fortran_include_flag: "-Imod"
    fccpx:
      cc:  { cmd: fccpx,  flags: [-Nclang] }
      cxx: { cmd: FCCpx,  flags: [-Nclang, -std=c++17] }
      openmp_flag: -Kopenmp
      common_flags: [-Kfast, -I.]
    frtpx:
      f90: { cmd: frtpx, flags: [-Cpp] }
      openmp_flag: -Kopenmp
      common_flags: [-Kfast, -I.]
      fortran_module_flag: "-Mmod"
      fortran_include_flag: "-Imod"

gpu:
  # Wisteria は NVHPC 24.1 系のため、古い -gpu=managed 文法を使用
  # Aquarius = A100 (cc80)。stdpar は cc を明示しないと
  # std::execution::par が cc<70 向けコード生成となり逐次実行に退化する。
  common_flags: ["-tp=native", "-gpu=cc80", "-O3", "-I.", "-Wall", "-Minfo=accel,opt,mp"]
  compiler:
    cc:  { cmd: nvc,       flags: [] }
    cxx: { cmd: nvc++,     flags: [-std=c++17] }
    f90: { cmd: nvfortran, flags: [-cpp] }
  memory_models:
    managed:  "-gpu=managed"
    separate: "-gpu=nomanaged"
  fortran_module_flag: "-module mod"
  fortran_include_flag: "-Imod"

# ジョブスクリプト生成用 (Wisteria は PJM = Fujitsu Job Manager)
job:
  scheduler: pjm
  submit_cmd: pjsub
  status_cmd: pjstat
  default_group: xxx
  # default_group が placeholder のときの課金グループ自動検出パターン (fnmatch)。
  # `id -Gn` の所属グループを上から順に照合し、最初に一致したものを採用する。
  group_patterns: ["g[a-z][0-9]*", "jh[0-9]*"]
  default_walltime: "00:10:00"
  # mode → リソースグループ (Aquarius=GPU node、Odyssey=A64FX CPU node)
  # modules はジョブスクリプト生成時に「推奨例」コメントとして出るのみ。自動 load されない。
  # 実際の module load はユーザがビルド env と合わせて手動で行う。
  per_mode:
    # modules はバージョンまで固定する (module load nvidia だけだと default の
    # nvidia/23.3 が入り、ビルド env (24.1) と実行 env がずれる)
    gpu: { queue: debug-a, omp_threads: 72, modules: ["nvidia/24.1"] }
    cpu: { queue: debug-o, omp_threads: 48, modules: ["fj"] }
  env:
    - "OMP_PROC_BIND=spread"
    - "OMP_PLACES=threads"

kokkos:
  # 要記入: 実機の Kokkos install 先 (KokkosConfig.cmake を含む prefix)。
  # 未記入なら configure.py が環境変数 Kokkos_ROOT や ~/kokkos/* 等から自動検出し、
  # それも失敗したら --kokkos-root での明示指定を促す。
  # 注意: cxx_standard は Kokkos 本体の要求と揃える必要がある。
  #       Kokkos 4.x = C++17、Kokkos 5.x = C++20 必須 (5.x を使うなら 20 に変更)。
  #       Miyabi (GH200) では 4.7.02 を CUDA(sm_90)+OpenMP backend でビルドして動作確認済み。
  root: /xxx/kokkos/4.7.02/
  # Wisteria は mode でアーキが変わる (GPU=Aquarius: x86_64+A100 / CPU=Odyssey: A64FX)。
  # Kokkos の実行空間は install 時に決まるので、install も mode ごとに分ける必要がある。
  # ここに書けば configure.py が mode に応じて使い分ける (未記入なら上の root → 自動検出)。
  #   gpu: CUDA backend (KOKKOS_ARCH_AMPERE80) を有効にした install
  #   cpu: OpenMP backend のみ + KOKKOS_ARCH_A64FX の install (FCCpx -Nclang でクロスビルド)
  root_per_mode:
    gpu: /xxx/kokkos/4.7.02
    cpu: /xxx/kokkos/4.7.02-a64fx
  # Kokkos をビルドした module 環境。生成ジョブスクリプトの「環境設定」推奨例に使う。
  # (Kokkos バイナリを nvidia module だけで起動すると GLIBCXX が合わず落ちる)
  modules_per_mode:
    gpu: ["gcc/12.2.0", "cuda/12.2"]
    cpu: ["fj"]
  cxx_standard: 17
